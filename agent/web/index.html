<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Porthole</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%234f6ef7' stroke-width='4'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234f6ef7'/%3E%3C/svg%3E">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <strong id="hostname">Porthole</strong>
      <span class="muted" id="subtitle">Connecting…</span>
    </div>
    <input class="filter" id="filter" type="search" placeholder="Filter" aria-label="Filter containers">
    <nav id="nav" aria-label="Containers"></nav>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="icon-button menu" id="menu" aria-label="Show containers">☰</button>
      <div class="title">
        <h1 id="title">Overview</h1>
        <span class="muted" id="title-sub"></span>
      </div>
      <div class="actions" id="actions"></div>
    </header>
    <section id="overview" class="overview"></section>
    <section id="log" class="log" hidden>
      <div class="logbar">
        <div class="chips" id="chips" role="group" aria-label="Levels"></div>
        <input class="search" id="search" type="search" placeholder="Search log" aria-label="Search log">
        <label class="follow"><input type="checkbox" id="follow" checked> Follow</label>
      </div>
      <div class="rows" id="rows" role="log" aria-live="off"></div>
      <div class="empty" id="log-empty" hidden>No lines match.</div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
